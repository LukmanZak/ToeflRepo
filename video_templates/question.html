<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .content { display: flex; flex-direction: column; justify-content: center; }
    .head { display: flex; justify-content: center; }
    .ring { position: relative; flex: none; width: 210px; height: 210px; animation: pop 0.7s cubic-bezier(.3,1.6,.5,1) 0.3s; }
    .ring svg { width: 210px; height: 210px; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 18; }
    .ring .track { stroke: var(--card-border); }
    .ring .fg { stroke: var(--brand); stroke-linecap: round; stroke-dasharray: 540.35; animation: drain {{ seconds }}s linear {{ lead }}s; }
    .ring.urgent .fg { stroke: var(--bad); }
    .ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 800; }
    .ring.urgent .num { color: var(--bad); }
    @keyframes drain { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 540.35; } }

    .question { margin-top: 40px; font-size: 56px; font-weight: 800; line-height: 1.25; animation: fadeUp 0.7s 0.2s; }
    .options { margin-top: 44px; display: flex; flex-direction: column; gap: 22px; }
    .option { display: flex; align-items: center; gap: 28px; padding: 22px 30px; border-radius: 28px; background: var(--card);
              border: 3px solid var(--card-border); box-shadow: var(--shadow); font-size: 42px; font-weight: 600; line-height: 1.22; }
    .option .letter { flex: none; width: 76px; height: 76px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; font-size: 40px;
                      display: flex; align-items: center; justify-content: center; }
    .option:nth-child(1) { animation: slideIn 0.6s cubic-bezier(.2,.8,.2,1) 0.6s; }
    .option:nth-child(2) { animation: slideIn 0.6s cubic-bezier(.2,.8,.2,1) 0.9s; }
    .option:nth-child(3) { animation: slideIn 0.6s cubic-bezier(.2,.8,.2,1) 1.2s; }
    .option:nth-child(4) { animation: slideIn 0.6s cubic-bezier(.2,.8,.2,1) 1.5s; }
</style>
</head>
<body data-seconds="{{ seconds }}" data-lead="{{ lead }}">
<div class="slide"><div class="content">
    <div class="head">
        <div class="ring" id="ring">
            <svg viewBox="0 0 210 210">
                <circle class="track" cx="105" cy="105" r="86"/>
                <circle class="fg" cx="105" cy="105" r="86"/>
            </svg>
            <div class="num" id="num">{{ seconds }}</div>
        </div>
    </div>
    <div class="question">{{ question }}</div>
    <div class="options">
        {% for letter in ['A', 'B', 'C', 'D'] %}
        <div class="option"><span class="letter">{{ letter }}</span><span>{{ options[letter] }}</span></div>
        {% endfor %}
    </div>
</div></div>
<script src="base.js"></script>
<script>
    // Counting is driven by the frame time, not by a timer, so every render is identical.
    var seconds = parseFloat(document.body.dataset.seconds);
    var lead = parseFloat(document.body.dataset.lead);
    window.onSeek = function (t) {
        var remaining = Math.max(0, Math.min(seconds, seconds - (t - lead)));
        var ring = document.getElementById("ring");
        var num = document.getElementById("num");
        num.textContent = Math.ceil(remaining);
        var urgent = remaining <= 3 && remaining > 0;
        ring.classList.toggle("urgent", urgent);
        num.style.transform = urgent ? "scale(" + (1 + 0.16 * (remaining - Math.floor(remaining))) + ")" : "none";
    };
</script>
</body>
</html>
