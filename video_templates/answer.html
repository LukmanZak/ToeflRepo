<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .content { display: flex; flex-direction: column; justify-content: center; }
    .question { margin-top: 0; font-size: 40px; font-weight: 600; line-height: 1.25; color: var(--muted); animation: fadeUp 0.6s 0.05s; }
    .options { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; }
    .option { display: flex; align-items: center; gap: 24px; padding: 16px 28px; border-radius: 26px; background: var(--card);
              border: 3px solid var(--card-border); box-shadow: var(--shadow); font-size: 38px; font-weight: 600; line-height: 1.2; }
    .option .letter { flex: none; width: 66px; height: 66px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; font-size: 36px;
                      display: flex; align-items: center; justify-content: center; }
    .option .mark { flex: none; margin-left: auto; width: 60px; height: 60px; opacity: 0; }

    /* Wrong answers fade back; the right answer lights up green with a check mark. */
    .option.wrong   { animation: dim 0.5s ease 0.4s; }
    .option.correct { animation: win 0.6s ease 0.4s; }
    .option.correct .letter { background: var(--good); }
    .option.correct .mark { animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 0.7s; }
    @keyframes dim { to { opacity: 0.35; } }
    @keyframes win { to { background: var(--good-soft); border-color: var(--good); } }

    .why { margin-top: 34px; padding: 28px 34px; border-radius: 30px; background: var(--card); border: 3px solid var(--accent);
           box-shadow: var(--shadow); animation: fadeUp 0.8s cubic-bezier(.2,.8,.2,1) 1.2s; }
    .why .head { font-size: 30px; font-weight: 800; color: #d98f00; letter-spacing: 2px; }
    .why .id { margin-top: 10px; font-size: 40px; font-weight: 800; line-height: 1.3; color: var(--fg); }
    .why .en { margin-top: 12px; font-size: 32px; font-weight: 400; line-height: 1.35; color: var(--muted); }
</style>
</head>
<body>
<div class="slide"><div class="content">
    <div class="question">{{ question }}</div>
    <div class="options">
        {% for letter in ['A', 'B', 'C', 'D'] %}
        <div class="option {{ 'correct' if letter == answer else 'wrong' }}">
            <span class="letter">{{ letter }}</span><span>{{ options[letter] }}</span>
            {% if letter == answer %}
            <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#1faa59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
            {% endif %}
        </div>
        {% endfor %}
    </div>
    <div class="why">
        <div class="head">KENAPA?</div>
        <div class="id">{{ explanation_id }}</div>
        <div class="en">{{ explanation_en }}</div>
    </div>
</div></div>
<script src="base.js"></script>
</body>
</html>
