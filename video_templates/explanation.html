<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .question { margin-top: 40px; font-size: 40px; font-weight: 600; line-height: 1.3; color: var(--muted); animation: fadeUp 0.6s 0.05s; }
    .options { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
    .option { display: flex; align-items: center; gap: 24px; padding: 12px 26px; border-radius: 20px; background: var(--card); border: 2px solid var(--card-border); font-size: 33px; line-height: 1.25; }
    .option .letter { flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #12304d; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; }
    .option .mark { flex: none; margin-left: auto; width: 54px; height: 54px; opacity: 0; }

    /* Wrong answers fade back; the right answer lights up green and gets a check mark. */
    .option.wrong   { animation: dim 0.5s ease 0.4s; }
    .option.correct { animation: win 0.6s ease 0.4s; }
    .option.correct .letter { background: var(--good); color: #fff; }
    .option.correct .mark { animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 0.7s; }
    @keyframes dim { to { opacity: 0.32; } }
    @keyframes win { to { background: rgba(46, 204, 113, 0.22); border-color: var(--good); } }

    .why { margin-top: 34px; padding: 26px 36px; border-radius: 24px; background: rgba(255, 193, 7, 0.12); border: 2px solid rgba(255, 193, 7, 0.5); animation: fadeUp 0.8s cubic-bezier(.2,.8,.2,1) 1.3s; }
    .why .head { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
    .why .body { margin-top: 8px; font-size: 38px; line-height: 1.35; }
</style>
</head>
<body>
<div class="slide"><div class="content">
    <div class="topbar">
        <span class="accent">Question {{ number }} of {{ total }}: Answer</span>
    </div>
    <div class="progress"><div style="width: {{ (number * 100 / total) | round(1) }}%"></div></div>
    <div class="question">{{ question }}</div>
    <div class="options">
        {% for letter in ['A', 'B', 'C', 'D'] %}
        <div class="option {{ 'correct' if letter == answer else 'wrong' }}">
            <span class="letter">{{ letter }}</span><span>{{ options[letter] }}</span>
            {% if letter == answer %}
            <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
            {% endif %}
        </div>
        {% endfor %}
    </div>
    {% if explanation %}
    <div class="why">
        <div class="head">WHY?</div>
        <div class="body">{{ explanation }}</div>
    </div>
    {% endif %}
</div></div>
<script src="base.js"></script>
</body>
</html>
