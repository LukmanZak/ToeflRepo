<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    /* 1280 x 720 YouTube thumbnail. Rendered once as a PNG (see render.render_thumbnail). */
    .content { display: flex; align-items: center; padding: 60px 80px; }
    .text { flex: 1; }
    .kicker { display: inline-block; padding: 8px 26px; border-radius: 12px; background: var(--accent); color: #12304d; font-size: 34px; font-weight: 800; letter-spacing: 2px; }
    h1 { font-size: 118px; font-weight: 800; line-height: 1.02; margin: 26px 0 18px; text-shadow: 0 6px 24px rgba(0,0,0,0.45); }
    h1 span { color: var(--accent); }
    .title { font-size: 44px; font-weight: 600; max-width: 700px; line-height: 1.25; }
    .badge { margin-top: 28px; display: inline-block; padding: 12px 34px; border-radius: 999px; background: var(--bad); font-size: 40px; font-weight: 800; }
    .icon { flex: none; width: 360px; height: 360px; filter: drop-shadow(0 10px 30px rgba(255,193,7,0.45)); }
</style>
</head>
<body>
<div class="slide"><div class="content">
    <div class="text">
        <div class="kicker">PRACTICE TEST</div>
        <h1>TOEFL<br><span>LISTENING</span></h1>
        <div class="title">{{ title }}</div>
        <div class="badge">{{ question_count }} QUESTIONS</div>
    </div>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ffc107" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 14v-2a9 9 0 0 1 18 0v2"/>
        <rect x="3" y="14" width="4" height="6" rx="1.5" fill="#ffc107"/>
        <rect x="17" y="14" width="4" height="6" rx="1.5" fill="#ffc107"/>
    </svg>
</div></div>
<script src="base.js"></script>
</body>
</html>
